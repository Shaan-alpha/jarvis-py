<!DOCTYPE html>
<html lang="en" data-theme="cyan">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="logo.svg" />
  <link rel="stylesheet" href="style.css" />
  <title>Jarvis</title>
  <!-- In <head> so the theme is applied before the first paint. -->
  <script src="theme.js"></script>
</head>
<body data-state="idle" data-link="down">
  <div id="ambient"></div>

  <main id="panel">
    <header id="titlebar">
      <div class="brand pywebview-drag-region">
        <img class="brand-mark" src="logo.svg" alt="" width="18" height="18" />
        <span class="brand-name">JARVIS</span>
      </div>
      <span id="chip" class="chip pywebview-drag-region" title="">
        <span class="chip-dot"></span><span id="chip-model">&mdash;</span>
      </span>
      <div class="drag-fill pywebview-drag-region"></div>
      <div class="wctrls">
        <button id="min" class="wctrl" type="button" title="Minimize" aria-label="Minimize">
          <span class="ico-min"></span>
        </button>
        <button id="close" class="wctrl close" type="button" title="Close Jarvis" aria-label="Close Jarvis">
          <span class="ico-close"></span>
        </button>
      </div>
    </header>

    <section class="stage">
      <div id="orb" data-state="idle">
        <div class="orb-glow"></div>
        <div class="orb-body">
          <div class="blob b1"></div>
          <div class="blob b2"></div>
          <div class="blob b3"></div>
          <div class="orb-sheen"></div>
        </div>
        <div class="orb-rim"></div>
      </div>
      <span id="pill" class="pill state" role="status">Connecting&hellip;</span>
      <button id="stop" class="stop" type="button" title="Stop (Esc)" aria-label="Stop speaking">
        <span class="stop-ico"></span>
      </button>
    </section>

    <section class="caps" aria-live="polite">
      <div id="cap-user" class="cap u"></div>
      <div id="cap-jarvis" class="cap j"></div>
    </section>

    <div id="toast" class="toast" hidden></div>

    <form id="form">
      <input id="input" type="text" placeholder="Ask Jarvis&hellip;" autocomplete="off" spellcheck="false" />
      <button type="submit" class="send" aria-label="Send">&#8629;</button>
    </form>

    <section id="wizard" class="wizard hidden">
      <h2>Setup</h2>
      <ul id="wizard-checks"></ul>
      <div class="wizard-row">
        <button id="wizard-recheck" type="button" class="ghost">Re-check</button>
        <button id="wizard-pull" type="button" class="hidden">Pull model</button>
      </div>
      <pre id="wizard-pull-log" class="hidden"></pre>
      <form id="wizard-form">
        <input id="wizard-name" type="text" placeholder="What should I call you?" autocomplete="off" />
        <button id="wizard-start" type="submit" disabled>Start Jarvis</button>
      </form>
    </section>
  </main>

  <script src="orb.js"></script>
  <script src="wizard.js"></script>
  <script src="app.js"></script>
</body>
</html>
