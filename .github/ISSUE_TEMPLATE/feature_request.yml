name: 💡 Feature Request
description: Propose an awesome new capability, tool agent, or integration for Jarvis-py.
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ### Propose a New Feature for Jarvis! 🚀
        We love expanding Jarvis's capabilities. Whether it's a new local LLM integration, tool agent, or memory upgrade, let us know below!
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: Is your feature request related to a problem or specific workflow?
      placeholder: e.g. I want Jarvis to control my Philips Hue smart lights locally without cloud APIs...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the tool agent or Python library you think would work best.
      placeholder: e.g. Create a new tool agent `control_lights(state)` using `phue`...
    validations:
      required: true
  - type: checkboxes
    id: pr
    attributes:
      label: Willing to Contribute?
      options:
        - label: I am willing to submit a pull request to implement this feature!
          required: false
